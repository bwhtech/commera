name: Setup bench
description: Create ~/frappe-bench with commera and its apps installed on test_site

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 24
        check-latest: true

    - name: Cache pip
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          ${{ runner.os }}-

    - name: Get yarn cache directory path
      id: yarn-cache-dir-path
      shell: bash
      run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

    - uses: actions/cache@v6
      with:
        path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
        key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-

    # No apt: the runner's Ubuntu mirrors can stall or stop resolving. Run the client that ships in the
    # MariaDB service container instead; only stdin and stdout reach it, which is all bench needs.
    - name: Use the MariaDB service's client
      shell: bash
      run: |
        container=$(docker ps --filter "publish=3306" --format '{{.ID}}' | head -n 1)
        if [ -z "$container" ]; then
          echo "No container publishes port 3306" >&2
          exit 1
        fi
        for bin in mariadb mariadb-dump; do
          printf '#!/bin/sh\nexec docker exec -i %s %s "$@"\n' "$container" "$bin" | sudo tee "/usr/local/bin/$bin" > /dev/null
          sudo chmod +x "/usr/local/bin/$bin"
        done

    - name: Setup
      shell: bash
      run: |
        pip install frappe-bench
        bench init --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
        mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
        mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

    - name: Install
      shell: bash
      working-directory: /home/runner/frappe-bench
      run: |
        bench get-app commera $GITHUB_WORKSPACE
        bench setup requirements --dev
        bench get-app erpnext
        # The client runs inside the MariaDB container, so the site user must log in from any host.
        bench new-site --db-root-password root --admin-password admin --mariadb-user-host-login-scope='%' test_site
        bench --site test_site install-app erpnext
        bench --site test_site install-app commera
        # Shop Theme records live in the module tree and only sync on migrate, never on install-app:
        # without this the theme engine has no themes and every themed page fails to resolve.
        bench --site test_site migrate
        bench build
      env:
        CI: 'Yes'
