# When updating this file, please also update the linter_workflow_template in frappe/utils/boilerplate.py
name: Linters

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commit-lint:
    name: 'Semantic Commits'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 200
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          check-latest: true

      - name: Check commit titles
        run: |
          npm install @commitlint/cli @commitlint/config-conventional
          npx commitlint --verbose --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  linter:
    name: 'Semgrep Rules'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip

      - name: Download Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Run Semgrep rules
        run: |
          pip install semgrep
          semgrep ci --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness

  precommit:
    name: 'Pre-Commit'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - uses: pre-commit/action@v3.0.1

  npm-audit:
    name: 'Vulnerable Dependency Check'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          check-latest: true
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # Critical only for now: the tree carries one high (vite <=6.4.2 via esbuild)
      # that needs a major bump to vite 8, so gating at high would land this red.
      # Raise to --audit-level=high once that upgrade lands.
      - name: Audit dashboard dependencies
        run: npm audit --omit=dev --audit-level=critical --prefix dashboard

  duplication:
    name: 'Code Duplication'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          check-latest: true

      # Mirrors the `dupes:py` / `dupes:vue` scripts in package.json. Run separately
      # because jscpd applies --threshold per format, so a combined run reports a
      # different number. Lower the threshold as cleanup lands; never raise it.
      - name: Run jscpd (python)
        run: npx --yes jscpd@4 commera --format python --threshold 1

      - name: Run jscpd (dashboard)
        run: npx --yes jscpd@4 dashboard/src --format vue,typescript,javascript --threshold 1

  dashboard-build:
    name: 'Dashboard Build'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          check-latest: true
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard

      # The dashboard is plain JS, so there is nothing for vue-tsc to check that
      # the build does not already reject: a bad import or template fails here.
      - name: Build the dashboard
        run: npm run build --prefix dashboard
