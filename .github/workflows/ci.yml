
name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
  merge_group:
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: develop-commera-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  storefront-js:
    runs-on: ubuntu-latest
    name: Storefront JS
    timeout-minutes: 5

    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # The package has no dependencies, so there is nothing to install.
      - name: Run Tests
        working-directory: packages/storefront
        run: node --test test/*.test.js

  tests:
    runs-on: ubuntu-latest
    # Server usually takes 12-18 minutes; this fails a stalled setup fast.
    timeout-minutes: 30
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup bench
        uses: ./.github/actions/setup-bench

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app commera
        env:
          TYPE: server

      - name: Show bench output
        if: always()
        working-directory: /home/runner/frappe-bench
        run: |
          cat bench_start.log || true
          cat logs/*.log || true

  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    timeout-minutes: 30
    name: E2E

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Setup bench
        uses: ./.github/actions/setup-bench

      - name: Create a site that never ran setup, in the background
        working-directory: /home/runner/frappe-bench
        run: |
          nohup bash -c "bench new-site --db-root-password root --admin-password admin --mariadb-user-host-login-scope='%' fresh_site \
            && bench --site fresh_site install-app erpnext \
            && bench --site fresh_site install-app commera \
            && bench --site fresh_site migrate \
            && echo FRESH_SITE_OK" > fresh_site.log 2>&1 &

      - name: Seed the store
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site execute commera.tests.e2e_support.seed | tee seed.log
          grep -q E2E_SEED_OK seed.log

      - name: Start web server, worker and socketio
        working-directory: /home/runner/frappe-bench
        run: |
          echo "127.0.0.1 test_site fresh_site" | sudo tee -a /etc/hosts
          nohup bench serve --port 8000 > web.log 2>&1 &
          nohup env -u CI bench worker --queue short,default > worker.log 2>&1 &
          nohup env -u CI bench worker --queue long > worker-long.log 2>&1 &
          nohup node apps/frappe/socketio.js > socketio.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf http://test_site:8000/api/method/frappe.ping && exit 0
            sleep 2
          done
          echo "web server never answered" >&2
          exit 1

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium

      - name: Wait for the fresh site
        working-directory: /home/runner/frappe-bench
        run: |
          for attempt in $(seq 1 120); do
            grep -q FRESH_SITE_OK fresh_site.log && exit 0
            pgrep -f "fresh_site" > /dev/null || break
            sleep 5
          done
          cat fresh_site.log
          exit 1

      - name: Run e2e
        working-directory: e2e
        run: npx playwright test
        env:
          COMMERA_BASE: http://test_site:8000
          COMMERA_FRESH_BASE: http://fresh_site:8000
          COMMERA_BENCH: /home/runner/frappe-bench

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

      - name: Show bench output
        if: failure()
        working-directory: /home/runner/frappe-bench
        run: |
          cat web.log worker.log worker-long.log socketio.log fresh_site.log || true
          cat logs/*.log || true
