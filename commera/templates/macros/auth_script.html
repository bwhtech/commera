<script>
    // One sign-in attempt is x_data.auth_step: 'email' (the form), 'sending' (asking for a code), 'code' (typing it),
    // 'resending', 'verifying', then 'done' once signed in, which stays set while the page moves on.
    // x_data.otp_sent is a getter over it in each component. This file is included once per modal, so it
    // declares functions only.

    function reset_auth_attempt(x_data) {
        x_data.auth_step = 'email';
        x_data.otp_for = null;
        x_data.otp = ['', '', '', '', '', ''];
        stop_resend_timer(x_data);
    }

    // A page restored from the back/forward cache after signing in would still say 'done'.
    function reset_auth_on_restore(x_data) {
        window.addEventListener('pageshow', (event) => {
            if (event.persisted && x_data.auth_step === 'done') reset_auth_attempt(x_data);
        });
    }

    async function sign_up_user(signup_data, ref) {
        if (!signup_data.email) {
            toast({{ _("Please enter a valid email") | tojson }}, { type: "warning" });
            return;
        }
        await request_otp(signup_data, ref, '/api/v2/method/commera.api.signup.send_signup_otp', {
            'email': signup_data.email,
            'first_name': signup_data.first_name,
            'last_name': signup_data.last_name
        });
    }

    // x-show reveals the OTP pane on the next animation frame, and a hidden input cannot take focus.
    function focus_first_otp_box(ref) {
        Alpine.nextTick(() => requestAnimationFrame(() => ref.otp0.focus()));
    }

    function handle_digit_input(data, refs, event, index) {
        event.target.value = event.target.value.replace(/[^0-9]/g, '').substring(0, 1);

        data.otp[index] = event.target.value;

        if (event.target.value && index < 5) {
            refs['otp' + (index + 1)].focus();
        }
    }

    function handle_backspace(refs, event, index) {
        if (!event.target.value && index > 0) {
            refs['otp' + (index - 1)].focus();
        }
    }

    function handle_paste(data, refs, event, startIndex) {
        event.preventDefault();
        const clipboardData = event.clipboardData || window.clipboardData;
        const pastedData = clipboardData.getData('Text').trim();

        if (!/^\d+$/.test(pastedData)) return;

        for (let i = 0; i < 6; i++) {
            if (i < pastedData.length) {
                data.otp[i] = pastedData.charAt(i);
            } else {
                data.otp[i] = '';
            }
        }

        if (pastedData.length < 6) {
            refs['otp' + Math.min(startIndex + pastedData.length, 5)].focus();
        } else {
            refs.otp5.focus();
        }
    }

    async function verify_otp(x_data, ref) {
        const otpValue = x_data.otp.join('');
        if (otpValue.length !== 6) {
            toast({{ _("Please enter a valid 6-digit OTP") | tojson }}, { type: "warning" });
            return;
        }
        if (x_data.auth_step !== 'code') return;
        // The code was sent for the tab it was asked from; a tab switched since must not pick the endpoint.
        const purpose = x_data.otp_for || x_data.selected_tab;
        let url;
        let args;
        if (purpose === 'checkout') {
            url = '/api/v2/method/commera.api.signup.verify_checkout_otp';
            args = {
                'email': x_data.email,
                'otp': otpValue,
            };
        } else if (purpose === 'login') {
            url = '/api/v2/method/commera.api.signup.verify_login_otp';
            args = {
                'email': x_data.email,
                'otp': otpValue,
            };
        } else {
            url = '/api/v2/method/commera.api.signup.verify_signup_otp';
            args = {
                'email': x_data.email,
                'otp': otpValue,
                'first_name': x_data.first_name,
                'last_name': x_data.last_name

            }
        }
        x_data.auth_step = 'verifying';
        try {
            await frappe_call(url, args);
        } catch (error) {
            x_data.auth_step = 'code';
            ref.verify_otp_btn?.focus();
            return;
        }
        // Signed in: the code is spent, so Verify stays off while the page moves on.
        x_data.auth_step = 'done';
        // Set by a page that signs the shopper in for somewhere else, such as /storefront-login.
        if (x_data.redirect_to) {
            window.location.href = x_data.redirect_to;
            return;
        }
        // The page's CSRF token belongs to the guest session, so checkout resumes on a fresh load.
        if (purpose === 'checkout') {
            const resume_url = new URL(window.location.href);
            resume_url.searchParams.set('checkout', '1');
            window.location.href = resume_url.toString();
            return;
        }
        const is_signup = url === '/api/v2/method/commera.api.signup.verify_signup_otp';
        toast(is_signup ? {{ _("Account created successfully") | tojson }} : {{ _("Logged in successfully") | tojson }}, { type: "success" });
        setTimeout(() => {
            window.location.reload()
        }, 1000);
    }
    function start_resend_timer(x_data) {
        stop_resend_timer(x_data);
        x_data.resend_timer = 15;
        x_data.resend_interval = setInterval(() => {
            x_data.resend_timer--;
            if (x_data.resend_timer <= 0) stop_resend_timer(x_data);
        }, 1000);
    }

    function stop_resend_timer(x_data) {
        clearInterval(x_data.resend_interval);
        x_data.resend_interval = null;
        x_data.resend_timer = 0;
    }

    function resend_otp(x_data, ref) {
        if (x_data.resend_timer > 0 || x_data.auth_step !== 'code') return;
        const purpose = x_data.otp_for || x_data.selected_tab;
        if (purpose === 'checkout') {
            send_checkout_otp(x_data, ref);
        }
        else if (purpose === 'login') {
            login_user(x_data, ref);
        }
        else {
            sign_up_user(x_data, ref);
        }
    }

    async function login_user(x_data, ref) {
        await request_otp(x_data, ref, '/api/v2/method/commera.api.signup.send_login_otp');
    }

    async function send_checkout_otp(x_data, ref) {
        await request_otp(x_data, ref, '/api/v2/method/commera.api.signup.send_checkout_otp');
    }

    // Sends the first code from 'email', or a new one from 'code'. The cooldown starts only once a code is sent,
    // so a failed send can be tried again at once.
    async function request_otp(x_data, ref, url, args = null) {
        const email = x_data.email;
        if (!email) {
            toast({{ _("Please enter a valid email") | tojson }}, { type: "warning" });
            return;
        }
        const is_resend = x_data.auth_step === 'code';
        if (!is_resend && x_data.auth_step !== 'email') return;
        x_data.auth_step = is_resend ? 'resending' : 'sending';
        try {
            await frappe_call(url, args || { 'email': email });
        } catch (error) {
            x_data.auth_step = is_resend ? 'code' : 'email';
            return;
        }
        toast({{ _("OTP sent successfully, please check your email.") | tojson }}, { type: "success" });
        // A new code replaces the old one, so the boxes start empty.
        x_data.otp = ['', '', '', '', '', ''];
        x_data.otp_for = x_data.otp_for && is_resend ? x_data.otp_for : x_data.selected_tab;
        x_data.auth_step = 'code';
        start_resend_timer(x_data);
        focus_first_otp_box(ref);
    }
</script>
