<div style="display:flex;flex-direction:row;width:1200px;height:630px;background:#111;color:#fff;font-family:'OpenSans';">
  <div style="display:flex;flex-direction:column;justify-content:space-between;flex-grow:1;flex-basis:0;padding:60px;">
    <div style="display:flex;flex-direction:column;">
      {% if store_name %}
      <div style="color:#d4af37;font-size:30px;font-weight:700;text-transform:uppercase;">{{ store_name | e }}</div>
      {% endif %}
      {% if display_name %}
      <div style="color:#fff;font-size:64px;font-weight:700;margin-top:20px;line-height:1.1;">{{ display_name | e }}</div>
      {% endif %}
      {% if brand %}
      <div style="color:#b4b4b4;font-size:36px;font-weight:400;margin-top:16px;">{{ brand | e }}</div>
      {% endif %}
    </div>
    {% if price %}
    <div style="color:#fff;font-size:48px;font-weight:700;">{{ price | e }}</div>
    {% endif %}
  </div>
  {% if photo_data_uri %}
  <div style="display:flex;width:630px;height:630px;background:#fff;">
    <img src="{{ photo_data_uri }}" style="width:630px;height:630px;object-fit:cover;" />
  </div>
  {% endif %}
</div>
