{% extends "commera/templates/og/base.html" %}

{% block head %}
<style>
	.card {
		display: flex;
		flex-direction: column;
		justify-content: space-between;
		height: 100%;
		padding: 72px 80px;
		background: #fafaf9;
		color: #1c1917;
		border-bottom: 16px solid #1c1917;
	}
	.logo { display: block; height: 140px; max-width: 600px; object-fit: contain; object-position: left; }
	[dir="rtl"] .logo { object-position: right; }
	.name {
		display: -webkit-box;
		-webkit-box-orient: vertical;
		-webkit-line-clamp: 2;
		overflow: hidden;
		overflow-wrap: anywhere;
		margin-top: 40px;
		font-size: 72px;
		font-weight: 700;
		line-height: 1.1;
	}
	.tagline {
		display: -webkit-box;
		-webkit-box-orient: vertical;
		-webkit-line-clamp: 2;
		overflow: hidden;
		max-width: 1000px;
		margin-top: 20px;
		color: #57534e;
		font-size: 34px;
		line-height: 1.35;
	}
	.host { color: #78716c; font-size: 28px; font-weight: 700; }
</style>
{% endblock %}

{% block body %}
<div class="card">
	<div>
		{% if logo_url %}<img class="logo" src="{{ logo_url | e }}" alt="">{% endif %}
		<div class="name">{{ store_name | e }}</div>
		{% if tagline %}<div class="tagline">{{ tagline | e }}</div>{% endif %}
	</div>
	{% if site_host %}<div class="host"><bdi>{{ site_host | e }}</bdi></div>{% endif %}
</div>
{% endblock %}
