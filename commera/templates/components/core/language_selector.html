{% set current_language = localization.language %}
<div x-data="{
  current_lang: '{{ current_language.code.lower() }}',
  root_prefix: '{{ localization.root_prefix }}',
  dropdown_open: false,
  change_language(lang) {
      if (lang === this.current_lang) return; // Do nothing if already selected
      window.location.href = `/${lang}${window.location.pathname.slice(this.root_prefix.length)}`;
  }
}">

  <div class="relative">
    <button class="flex items-center rounded-lg border border-gray-300 px-4 py-1 w-fit cursor-pointer"
      @click="dropdown_open = !dropdown_open">
      <div></div>
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 me-2" fill="none" viewBox="0 0 24 24"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
      </svg>
      <span class="me-2">{{ current_language.endonym }}</span>

      <svg xmlns="http://www.w3.org/2000/svg" :class="{ 'h-4 w-4 ': true, 'transition-transform duration-200 transform rotate-180': dropdown_open }"
        fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </button>

    <div x-show="dropdown_open" @click.away="dropdown_open = false"
      class="absolute left-0 mt-2 w-full bg-white border border-gray-300 rounded-lg shadow-md z-50" x-cloak>
      <ul class="py-2">
        {% for option in localization.available_languages %}
        <li class="px-4 py-2 hover:bg-gray-200 cursor-pointer" lang="{{ option.code }}" dir="{{ option.direction }}"
          @click="change_language('{{ option.code.lower() }}'); dropdown_open = false">
          {{ option.endonym }}
        </li>
        {% endfor %}
      </ul>
    </div>
  </div>
</div>
