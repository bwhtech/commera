<div x-data="{
    filters: {{ filters }},
    query_state: window.query_state,
    accordion: null,
    format_key(key) {
        const formatted = key.replace(/([A-Z])/g, ' $1').trim();
        return formatted.charAt(0).toUpperCase() + formatted.slice(1);
    },
    // Ticks land here first. Wide screens apply each one at once; below 768px the panel applies them together
    // with its Apply button, so the URL never shows filters the page has not loaded.
    pending: { ...window.query_state },
    reset_filters() {
        window.query_sync.update(Object.fromEntries(Object.keys(this.query_state).map((key) => [key, null])));
        window.location.reload()
    },
    // `value` is either one option or the list of item groups a facet filters on, so it ticks only when every one is selected.
    selected_values(query_key) {
        return this.pending[query_key] ? this.pending[query_key].split(',') : [];
    },
    toggle_filter(key, value, is_subcategory = false) {
        let query_key = is_subcategory ? 'subcategory' : key;
        let values = [].concat(value).map(String);
        let current_selections = this.selected_values(query_key);

        if (this.is_checked(key, value, is_subcategory)) {
            current_selections = current_selections.filter(item => !values.includes(item));
        } else {
            current_selections = current_selections.concat(values.filter(item => !current_selections.includes(item)));
        }

        this.pending[query_key] = current_selections.length ? current_selections.join(',') : '';

        if(window.innerWidth > 768){
            this.apply_filters();
        }
    },
    toggle_price_filter(key,value){
        this.pending[key] = String(value);
        if(window.innerWidth > 768){
            this.apply_filters();
        }
    },
    is_checked(key, value, is_subcategory = false) {
        let query_key = is_subcategory ? 'subcategory' : key;
        let values = [].concat(value).map(String);
        let current_selections = this.selected_values(query_key);
        return values.length > 0 && values.every(item => current_selections.includes(item));
    },
    // One history entry, back on page 1: a narrower result set has fewer pages.
    apply_filters(){
        window.query_sync.update({ ...this.pending, page: 1 });
        window.location.reload()
    }
    }" class="md:h-[70vh] md:overflow-y-auto no-scrollbar">
    <div class="mb-5 hidden items-center justify-between border-b border-gray-300 pb-5 md:flex">
        <h2 class="mb-4 text-lg font-medium capitalize">
            {{_('filter by')}}
        </h2>
        <button class="mb-4 text-lg font-medium text-primary hover:text-accent cursor-pointer capitalize" @click="reset_filters">
            {{_('reset all')}}
        </button>
    </div>
    <div x-data="{ current_tab: null }">
        <template x-for="(values, key) in filters" :key="key">
            <div class="border-b border-gray-300">
                <button @click="current_tab = (current_tab === key) ? null : key"
                    class="flex w-full items-center justify-between py-4 text-lg font-medium cursor-pointer">
                    <span><bdi x-text="commera.t(format_key(key))"></bdi></span>
                    <svg class="w-5 h-5 transition-transform duration-200"
                        :class="{ 'rotate-180': current_tab === key }" xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                            clip-rule="evenodd" />
                    </svg>
                </button>
                <div x-show="current_tab === key && !Array.isArray(values[0]) && !Array.isArray(values)"
                    x-transition class="pt-6 pb-6">
                    <div class="space-y-2">
                        <template x-for="(option, index) in values" :key="index">
                            <div class="flex items-center">
                                <input type="checkbox" :id="`${key}-${option}-${index}`" :value="option"
                                    @change="toggle_filter(key, option, false)"
                                    :checked="is_checked(key, option, false)"
                                    class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
                                <label :for="`${key}-${option}-${index}`" class="ms-2 text-sm text-gray-700 capitalize"><bdi x-text="commera.t(option)"></bdi></label>
                            </div>
                        </template>
                    </div>
                </div>
                {# `item_groups` are the groups the `?subcategory=` filter round-trips; `display_name` is the shop owner's label. #}
                {% block storefront_filter_categories %}
                <div x-show="current_tab === key && Array.isArray(values) && values.length > 0 && values[0].display_name" x-transition
                    class="pt-6 pb-6">
                    {# x-show only hides this block, so without the x-if the loop also runs for brand, size and colour strings, which have no item_groups. #}
                    <template x-if="Array.isArray(values) && values.length > 0 && values[0].display_name">
                    <div>
                    <template x-for="(node, node_index) in values" :key="node_index">
                        <div class="mb-3">
                            <div x-data="{ open: false }">
                                <div x-show="!node.is_leaf" class="flex items-center">
                                    <span class="flex items-center text-gray-800 font-semibold"><bdi x-text="commera.t(node.display_name)"></bdi></span>

                                </div>

                                <div x-show="node.is_leaf" class="flex items-center">
                                    <input type="checkbox" :id="`${key}-${node_index}`" :value="node.item_groups.join(',')"
                                        @change="toggle_filter(key, node.item_groups, true)"
                                        :checked="is_checked(key, node.item_groups, true)"
                                        class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
                                    <label :for="`${key}-${node_index}`" class="ms-2 text-sm text-gray-700 capitalize"><bdi x-text="commera.t(node.display_name)"></bdi></label>
                                </div>

                                <div class="pl-3 mt-2 space-y-2">
                                    <template x-for="(child, child_index) in node.children" :key="child_index">
                                        <div x-data="{ childOpen: false }" class="mb-2">

                                            <div x-show="!child.is_leaf" class="flex items-center">
                                                <button @click="childOpen = !childOpen"
                                                    class="flex items-center text-gray-800 font-medium">
                                                 
                                                    <span><bdi x-text="commera.t(child.display_name)"></bdi></span>
                                                </button>
                                            </div>

                                            <div x-show="child.is_leaf" class="flex items-center">
                                                <input type="checkbox"
                                                    :id="`${key}-${node_index}-${child_index}`"
                                                    :value="child.item_groups.join(',')"
                                                    @change="toggle_filter(key, child.item_groups, true)"
                                                    :checked="is_checked(key, child.item_groups, true)"
                                                    class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
                                                <label :for="`${key}-${node_index}-${child_index}`"
                                                    class="ms-2 text-sm text-gray-700 capitalize"><bdi x-text="commera.t(child.display_name)"></bdi></label>
                                            </div>

                                            <div class="pl-3 mt-2 space-y-2">
                                                <template x-for="(grandchild, grandchild_index) in child.children"
                                                    :key="grandchild_index">
                                                    <div class="flex items-center">
                                                        <input type="checkbox"
                                                            :id="`${key}-${node_index}-${child_index}-${grandchild_index}`"
                                                            :value="grandchild.item_groups.join(',')"
                                                            @change="toggle_filter(key, grandchild.item_groups, true)"
                                                            :checked="is_checked(key, grandchild.item_groups, true)"
                                                            class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
                                                        <label
                                                            :for="`${key}-${node_index}-${child_index}-${grandchild_index}`"
                                                            class="ms-2 text-sm text-gray-700 capitalize"><bdi x-text="commera.t(grandchild.display_name)"></bdi></label>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>
                    </div>
                    </template>
                </div>
                {% endblock %}
        </template>
        <div class="border-b border-gray-300">
            <button @click="current_tab = (current_tab === 'price_range') ? null : 'price_range'"
                class="flex w-full items-center justify-between py-4 text-lg font-medium">
                {{_('Price')}}
                <svg class="w-5 h-5 transition-transform duration-200"
                    :class="{ 'rotate-180': current_tab === 'price_range' }" xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                        clip-rule="evenodd" />
                </svg>
            </button>
            <div x-show="current_tab === 'price_range'" x-transition:enter="transition ease-in-out duration-300"
                x-transition:enter-start="opacity-0 transform -translate-y-4"
                x-transition:enter-end="opacity-100 transform translate-y-0"
                x-transition:leave="transition ease-in-out duration-300"
                x-transition:leave-start="opacity-100 transform translate-y-0"
                x-transition:leave-end="opacity-0 transform -translate-y-4" class="pt-6 pb-6">
                <p class="mb-3 text-sm capitalize">{{_('price range')}}</p>
                <div x-data="{
                    min_price: {{ price_range.min_price }},
                    max_price: {{ price_range.max_price }},
                    min: window.query_state.min ? parseInt(window.query_state.min) : {{ price_range.min_price }},
    max: window.query_state.max ? parseInt(window.query_state.max) : {{ price_range.max_price }},
                    error_min: '',
                    error_max: '',
                    // An out-of-range value is pulled back into range and applied, so the box and the results agree.
                    validate_min() {
                        if (this.min < this.min_price) {
                            this.error_min = commera.t('Min price must be at least')
                            this.error_min += ` ${this.min_price}`;
                            this.min = this.min_price;
                        } else if (this.min > this.max) {
                            this.error_min = commera.t('Min price cannot exceed max price');
                            this.min = this.max;
                        } else {
                            this.error_min = '';
                        }
                        toggle_price_filter('min',this.min)

                    },
                    validate_max() {
                        if (this.max > this.max_price) {
                            this.error_max = commera.t('Max price cannot exceed')
                            this.error_max += ` ${this.max_price}`;
                            this.max = this.max_price;
                        } else if (this.max < this.min) {
                            this.error_max = commera.t('Max price must exceed min price');
                            this.max = this.min;
                        } else {
                            this.error_max = '';
                        }
                        toggle_price_filter('max',this.max)

                    }
                }" class="flex w-full items-center justify-between gap-3">
                    <div class="flex flex-1 flex-col ">
                        <input type="number"
                            class="w-full rounded-lg border border-gray-300 p-1.5 ps-4 placeholder-gray-300 focus:ring-2 focus:ring-gray-300 focus:outline-gray-300"
                            placeholder="Min" x-model="min" x-bind:min="min_price" x-bind:max="max_price"
                            @change="validate_min()" />
                        <div class="h-5">
                            <span x-show="error_min" class="text-red-600 text-xs ms-2" x-text="error_min"></span>
                        </div>
                    </div>
                    <div class="flex flex-1 flex-col">
                        <input type="number"
                            class="w-full rounded-lg border border-gray-300 p-1.5 ps-4 placeholder-gray-300 focus:ring-2 focus:ring-gray-300 focus:outline-gray-300"
                            placeholder="Max" x-model="max" x-bind:min="min_price" x-bind:max="max_price"
                            @change="validate_max" />
                        <div class="h-5">
                            <span x-show="error_max" class="text-red-600 text-xs ms-2" x-text="error_max"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-15 flex items-center justify-between gap-3 md:hidden">
            <button @click="reset_filters"
                class="w-full rounded-lg border border-red-800 p-2 px-3 text-lg font-medium text-primary hover:bg-primary hover:text-white capitalize">
                {{_('reset all')}}
            </button>
            <button
                class="transition-easein w-full rounded-lg border bg-primary p-2 px-3 text-lg font-medium text-white duration-300 hover:bg-primary-hover capitalize"
                @click="apply_filters">
                {{_('apply filters')}}
            </button>
        </div>
    </div>
    <div class="h-10 hidden md:block"></div>
</div>
<div
    class="hidden md:block pointer-events-none absolute bottom-0 left-0 right-0 h-20 bg-gradient-to-t from-white to-transparent z-10">
</div>
