<script defer>
    document.addEventListener('alpine:init', () => {
        Alpine.store('wishlist', {
            items: Alpine.$persist([]).as("wishlist_items"),
            route_set: new Set(),
            prices_ready: false,
            // Keep market prices off persisted entries so refreshes do not echo between tabs.
            display_items: [],
            price_cache: {},
            refresh_pending: null,
            prices_failed: false,
            market_key: null,

            init() {
                this.refresh_route_set();
                this.refresh_prices();
                // Another tab's add or remove lands in localStorage only; take it, or this tab's next change
                // writes its older list over it.
                window.addEventListener('storage', (event) => {
                    if (event.storageArea !== localStorage || event.key !== 'wishlist_items') return;
                    // A queued event for an older list would write it back and echo between the tabs forever.
                    if (event.newValue !== localStorage.getItem('wishlist_items')) return;
                    let items;
                    try {
                        items = JSON.parse(event.newValue);
                    } catch (error) {
                        return;
                    }
                    this.items = Array.isArray(items) ? items : [];
                    this.refresh_route_set();
                    this.refresh_prices();
                });
            },

            async refresh_prices(retry = false) {
                const [market] = with_page_localization('/api/v2/method/commera.api.storefront.products.get_wishlist_prices', {}, 'GET');
                if (this.market_key !== market || retry) {
                    this.market_key = market;
                    this.price_cache = {};
                }
                this.render_prices();
                if (this.refresh_pending) return this.refresh_pending;
                this.refresh_pending = this.load_prices();
                try {
                    await this.refresh_pending;
                } finally {
                    this.refresh_pending = null;
                    this.render_prices();
                }
            },

            async load_prices() {
                this.prices_ready = false;
                while (true) {
                    const market = this.market_key;
                    const handles = [...new Set(this.items.map(item => item.route))]
                        .filter(handle => !(handle in this.price_cache)).slice(0, 100);
                    if (!handles.length) break;
                    try {
                        const url = market + (market.includes('?') ? '&' : '?') + 'handles=' + encodeURIComponent(JSON.stringify(handles));
                        const response = await fetch(url, { headers: { Accept: 'application/json' } });
                        if (!response.ok) throw new Error('Wishlist refresh failed');
                        const { data } = await response.json();
                        if (!Array.isArray(data)) throw new Error('Invalid wishlist response');
                        if (market !== this.market_key) continue;
                        for (const handle of handles) {
                            this.price_cache[handle] = data.find(product => product.handle === handle) ?? null;
                        }
                    } catch (error) {
                        if (market !== this.market_key) continue;
                        for (const handle of handles) this.price_cache[handle] = null;
                    }
                    this.render_prices();
                }
                this.prices_ready = true;
            },

            render_prices() {
                this.prices_failed = this.items.some(item => this.price_cache[item.route] === null);
                this.display_items = this.items.map(item => {
                    const product = this.price_cache[item.route];
                    return {
                        ...item,
                        sale_price: product?.price ?? null,
                        default_price: product?.compare_at_price ?? null,
                        currency: product?.currency,
                        available: product?.available,
                    };
                });
            },

            refresh_route_set() {
                this.route_set = new Set(this.items.map(item => item.route));
            },

            is_in_wishlist(item) {
                return this.route_set.has(item.route);
            },

            add(item) {
                if (this.is_in_wishlist(item)) {
                    toast("Item already in wishlist!", { type: "warning" });
                    return;
                }
                this.items.push(item);
                this.refresh_prices();
                this.refresh_route_set();
                toast("Item added to wishlist!", { type: "success" });
            },

            remove(item) {
                this.items = this.items.filter(w_item => w_item.route !== item.route);
                this.refresh_prices();
                this.refresh_route_set();
            },

            get count() {
                return this.items.length;
            }
        })

    })
</script>
