<script>
    // Defined before Alpine starts, so a toast raised while the page loads (a failed request, say) waits for the
    // toaster instead of being dispatched to no listener. toast-teleport.html sets toast_ready and drains the queue.
    window.toast_queue = window.toast_queue || [];
    window.toast = function (message, options = {}) {
        const detail = {
            type: options.type ?? 'default',
            message: message,
            description: options.description ?? '',
            position: options.position ?? 'top-right',
            html: options.html ?? '',
        };
        if (window.toast_ready) window.dispatchEvent(new CustomEvent('toast-show', { detail }));
        else window.toast_queue.push(detail);
    };

    document.addEventListener('alpine:init', () => {
        Alpine.data('toaster', () => ({
            title: 'Default Toast Notification',
            description: '',
            type: 'default',
            position: 'top-center',
            expanded: false,
            popToast(custom) {
                let html = '';
                if (typeof custom != 'undefined') {
                    html = custom;
                }
                toast(this.title, { description: this.description, type: this.type, position: this.position, html: html })
            }
        }));
    })
</script>
