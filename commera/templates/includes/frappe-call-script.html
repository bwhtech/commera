{% set call_localization = localization if localization is defined else get_localization() -%}
<script>
    // API routes have no locale prefix, so carry the page's market and language explicitly.
    function with_page_localization(url, args, method) {
        const page_context = {
            _lang: {{ call_localization.language.code | tojson }},
            _country: {{ call_localization.country | tojson }},
        };
        if (method === "POST" || method === "PUT") {
            const body = args ?? {};
            if (typeof body !== "object" || Array.isArray(body)) return [url, args];
            return [url, { ...page_context, ...body }];
        }
        const target = new URL(url, window.location.origin);
        for (const [key, value] of Object.entries(page_context)) {
            if (value && !target.searchParams.has(key)) target.searchParams.set(key, value);
        }
        return [target.pathname + target.search, args];
    }

    async function frappe_call(url, args, method = "POST") {
        [url, args] = with_page_localization(url, args, method);
        let response;
        let headers = {
            'Content-Type': 'application/json; charset=utf-8',
            "X-Frappe-CSRF-Token": '{{ frappe.session.csrf_token }}',
            Accept: "application/json",
        }
        try {
            if (method === "POST" || method === "PUT") {
                response = await fetch(url, { body: JSON.stringify(args), method, headers })
            }
            else {
                response = await fetch(url)
            }
        } catch (error) {
            if (error.name !== "AbortError") {
                toast({{ _("Could not reach the store. Check your connection and try again.") | tojson }}, { type: "danger" })
            }
            throw error
        }

        const fallback_message = {{ _("Something went wrong") | tojson }}
        let data
        try {
            data = await response.json()
        } catch (error) {
            toast(fallback_message, { type: "danger" })
            throw error
        }

        if (data.errors) {
            const error = data.errors[0]

            if (error.message) {
                toast(error.message, { type: "danger" })
            } else {
                toast({{ _("Internal Server Error") | tojson }}, { type: "danger" })
            }

            const server_error = Error(error.exception)
            server_error.type = error.type
            throw server_error
        }

        if (!response.ok) {
            toast(fallback_message, { type: "danger" })
            throw Error(`${response.status} ${response.statusText}`)
        }

        return data
    }

    async function logout(redirect_url) {
        // The admin's theme preview frames the storefront on the same origin, so logging out here would end their Desk session too.
        if (window.self !== window.top) {
            toast({{ _("You can't log out from the preview.") | tojson }}, { type: "warning" })
            return
        }

        await frappe_call("/api/v2/method/logout")
        if (redirect_url) {
            window.location.href = redirect_url
        } else {
            window.location.reload()
        }
    }
</script>
