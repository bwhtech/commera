{% extends "templates/layout.html" %}

{% block body %}
<div class=" shadow p-5 m-4">
    <h1 class="text-xl font-semibold text-gray-800">{{ _('Checking payment status') }}</h1>
    <p>{{ _('Please do not refresh') }}...</p>
    {% if login_url %}
    <a class="underline" href="{{ login_url }}">{{ _('Checked out with an account? Sign in to confirm your order') }}</a>
    {% endif %}
</div>

<script defer>
    const url_params = new URLSearchParams(window.location.search);
    const payment_mode = url_params.get('payment_mode');
// Legacy gateway redirects return `payment_id` and Stripe substitutes `session_id`; all three resolve through Gateway Payment Request.order_ref.
    const reference_id = url_params.get('reference_id') || url_params.get('payment_id') || url_params.get('session_id');
    function track_purchase(data, order_name) {
// The first-party `purchase` event is logged server-side at order creation; the capture endpoint rejects it from the client.
        const dedup_key = 'fb_purchase_' + order_name;
        if (sessionStorage.getItem(dedup_key)) return;
        sessionStorage.setItem(dedup_key, '1');

        const order_value = parseFloat(data.grand_total || data.amount || 0) || 0;

// eventID lets Meta dedupe this browser hit against a future server-side Purchase.
        if (window.fbq) fbq('track', 'Purchase',
            { value: order_value, currency: data.currency || window.fb_currency },
            { eventID: order_name });

        if (window.gtag) gtag('event', 'purchase', {
            transaction_id: order_name,
            value: order_value,
            currency: data.currency || window.ga4_currency
        });
    }

    async function confirm_payment() {
// TODO: handle errors, unpaid, etc.
        const args = { reference_id };
        if (payment_mode) args.payment_mode = payment_mode;

        const { data } = await frappe_call(
            "/api/v2/method/commera.api.payments.confirm_payment",
            args
        );
        if (data.status !== "Paid") return;

        const order_name = data.order_name || data.ref_docname || reference_id;
        if (order_name) track_purchase(data, order_name);

        Alpine.store("cart").remove_selected();
        window.location.href = data.order_link || `/{{frappe.lang}}/account/orders`;
    }

    confirm_payment();
</script>
{% endblock %}
