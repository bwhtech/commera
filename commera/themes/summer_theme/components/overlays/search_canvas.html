
{% set language = frappe.lang or "en" %}
<script src="{{ shop_theme_asset_url('js/summer_search.js') }}"></script>
<div class="dz-search-area dz-offcanvas offcanvas offcanvas-top" tabindex="-1" role="dialog"
	aria-label="{{ _('Search') }}"
	:class="search_open ? 'show' : ''"
	x-trap.noscroll="search_open"
	@keydown.escape.window="search_open = false">
	<button type="button" class="btn-close" @click="search_open = false" aria-label="{{ _('Close') }}">
		&times;
	</button>
	<div class="container" x-data='summer_search({{ {"language": language} | tojson }})'>
		<form class="header-item-search" action="/{{ language }}/products" method="get">
			<div class="input-group search-input">
				<select class="default-select" name="category" aria-label="{{ _('Category') }}">
					<option value="">{{ _("All Categories") }}</option>
					{% for node in header_data.navigation_menu %}
					<option value="{{ node.route_slug or node.name }}">{{ node.label }}</option>
					{% endfor %}
				</select>
				<input type="search" class="form-control" name="search" placeholder="{{ _('Search Product') }}"
					x-ref="search_field" x-model="search_term" @input="handle_input()"
					autocomplete="off" role="combobox" aria-autocomplete="list"
					aria-controls="summer-search-results" :aria-expanded="products.length > 0">
				<button class="btn" type="submit" aria-label="{{ _('Search') }}">
					<i class="iconly-Light-Search"></i>
				</button>
			</div>
			{% if header_data.navigation_menu %}
			<ul class="recent-tag">
				<li class="pe-0"><span>{{ _("Quick Search") }} :</span></li>
				{% for node in header_data.navigation_menu[:4] %}
				<li><a href="{{ node.href or '/' ~ language ~ '/products' }}">{{ node.label }}</a></li>
				{% endfor %}
			</ul>
			{% endif %}
		</form>

		<div id="summer-search-results" aria-live="polite">
			<h5 class="mb-3" x-cloak x-show="loading">{{ _("Searching") }}&hellip;</h5>

			<h5 class="mb-3" x-cloak x-show="!loading && corrected_query">
				{{ _("Showing results for") }} &ldquo;<span x-text="corrected_query"></span>&rdquo;
			</h5>

			<ul class="recent-tag mb-3" x-cloak x-show="!loading && categories.length">
				<li class="pe-0"><span>{{ _("Categories") }} :</span></li>
				<template x-for="category in categories" :key="category.name">
					<li><a :href="category.url" x-text="category.label"></a></li>
				</template>
			</ul>

			<template x-if="!loading && matched_term && !products.length">
				<h5 class="mb-3">{{ _("No products found for") }} &ldquo;<span x-text="matched_term"></span>&rdquo;</h5>
			</template>

			<div class="row" x-cloak x-show="!loading && products.length">
				<template x-for="product in products" :key="product.name">
					<div class="col-6 col-md-4 col-xl-2 mb-4">
						{# No .wow here: summer.js wires its reveal observer at load, so a card added later would stay hidden. #}
						<div class="shop-card">
							<div class="dz-media">
								<a :href="get_product_url(product)" tabindex="-1" aria-hidden="true">
									<img :src="product.image || '/assets/commera/images/1.jpg'" :alt="get_product_name(product)">
								</a>
							</div>
							<div class="dz-content">
								<h5 class="title"><a :href="get_product_url(product)" x-text="get_product_name(product)"></a></h5>
								{# Concatenating the currency symbol into x-text would escape it, so Jinja stamps it beside the amount. #}
								<h5 class="price">
									{{ get_currency_symbol() }}<span x-text="format_amount(product.effective_price)"></span>
									<template x-if="product.has_discount">
										<del>{{ get_currency_symbol() }}<span x-text="format_amount(product.default_price)"></span></del>
									</template>
								</h5>
							</div>
						</div>
					</div>
				</template>
			</div>
		</div>
	</div>
</div>
