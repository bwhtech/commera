{% macro discount_code_chips(codes, saving, remove, classes="") -%}
<div class="d-flex flex-wrap gap-2 {{ classes }}" x-show="{{ codes }}.length" x-cloak
	x-data='{ remove_label: {{ _("Remove {0}") | tojson }} }'>
	<template x-for="code_state in {{ codes }}" :key="code_state.code">
		<div>
			<span class="checkout-discount-chip">
				<i class="fa-solid fa-tag" aria-hidden="true"></i>
				<span x-text="code_state.code"></span>
				<button type="button" :aria-label="remove_label.replace('{0}', code_state.code)"
					:disabled="{{ saving }}" @click="{{ remove }}(code_state.code)">
					<i class="fa-solid fa-xmark" aria-hidden="true"></i>
				</button>
			</span>
			<p class="checkout-discount-reason" x-show="code_state.reason" x-text="code_state.reason"></p>
		</div>
	</template>
</div>
{%- endmacro %}
