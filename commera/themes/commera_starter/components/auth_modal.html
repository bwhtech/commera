{% from "components/macros/transitions.html" import overlay, scrim, drawer, sheet, dialog %}
{% from "components/auth_form.html" import auth_form with context %}
{% from "components/macros/icons.html" import icon %}

<div x-data="{ open: false }" x-cloak x-show="open" {{ overlay() }} @open-auth.window="open = true" @keydown.escape.window="open = false"
    @open-cart.window="open = false" @open-search.window="open = false" @open-menu.window="open = false" class="fixed inset-0 z-50 grid place-items-center p-4" role="dialog" aria-modal="true" aria-label="{{ _('Log in') }}">
	<div x-show="open" {{ scrim() }} @click="open = false" class="absolute inset-0 cursor-pointer bg-surface-alpha-gray-6"></div>
	<div x-show="open" x-trap.noscroll="open" {{ dialog() }} class="relative max-h-full w-full max-w-md overflow-y-auto rounded-2xl bg-surface-elevation-1 p-8 shadow-xl">
		<button type="button" @click="open = false" class="icon-button absolute end-3 top-3" aria-label="{{ _('Close') }}">{{ icon("close", "size-4") }}</button>
		{{ auth_form("login") }}
	</div>
</div>
