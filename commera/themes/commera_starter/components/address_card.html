{% from "components/macros/icons.html" import spinner %}

<div class="flex h-full flex-col rounded-xl border border-outline-gray-2 p-5">
	<p class="text-md font-medium"><bdi x-text="address.address_title"></bdi></p>
	<p class="mt-2 text-p-md text-ink-gray-7"><bdi x-text="[address.address_line1, address.address_line2].filter(Boolean).join(', ')"></bdi></p>
	<p class="text-p-md text-ink-gray-7"><bdi x-text="[address.city, address.state, address.pincode].filter(Boolean).join(', ')"></bdi></p>
	<p class="text-p-md text-ink-gray-7"><bdi x-text="address.country"></bdi></p>
	<p x-show="address.phone" class="text-p-md text-ink-gray-7"><bdi dir="ltr" x-text="address.phone"></bdi></p>
	<p x-show="address.is_primary_address" class="mt-3 text-base text-ink-gray-6">{{ _("Default address") }}</p>
	<div class="-mx-1 mt-auto flex gap-3 pt-3">
		<button type="button" @click="edit(address)" class="inline-flex min-h-10 min-w-10 items-center px-1 text-base text-ink-gray-8 link hover:text-ink-gray-9">{{ _("Edit") }}</button>
		<button type="button" @click="remove(address)" :disabled="busy" :aria-busy="busy === 'remove:' + address.name" class="inline-flex min-h-10 items-center gap-1 px-1 text-base text-ink-gray-6 link hover:text-ink-gray-9">{{ _("Delete") }}{{ spinner("busy === 'remove:' + address.name", "size-4 text-ink-gray-6") }}</button>
	</div>
</div>
