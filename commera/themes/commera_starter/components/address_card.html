<div class="flex h-full flex-col rounded-xl border border-outline-gray-2 p-5">
	<p class="text-base font-medium"><bdi x-text="address.address_title"></bdi></p>
	<p class="mt-2 text-p-base text-ink-gray-7"><bdi x-text="[address.address_line1, address.address_line2].filter(Boolean).join(', ')"></bdi></p>
	<p class="text-p-base text-ink-gray-7"><bdi x-text="[address.city, address.state, address.pincode].filter(Boolean).join(', ')"></bdi></p>
	<p class="text-p-base text-ink-gray-7"><bdi x-text="address.country"></bdi></p>
	<p x-show="address.phone" class="text-p-base text-ink-gray-7"><bdi dir="ltr" x-text="address.phone"></bdi></p>
	<p x-show="address.is_primary_address" class="mt-3 text-sm text-ink-gray-6">{{ _("Default address") }}</p>
	<div class="mt-auto flex gap-4 pt-4">
		<button type="button" @click="edit(address)" class="text-sm text-ink-gray-8 underline hover:text-ink-gray-9">{{ _("Edit") }}</button>
		<button type="button" @click="remove(address)" :disabled="busy" class="text-sm text-ink-gray-6 underline hover:text-ink-gray-9">{{ _("Delete") }}</button>
	</div>
</div>
