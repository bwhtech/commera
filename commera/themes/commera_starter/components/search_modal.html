{% from "components/macros/icons.html" import icon %}
{% set language = frappe.lang or "en" %}

<div x-data="search_modal" x-cloak x-show="open" @open-search.window="show()" @keydown.escape.window="open = false" class="fixed inset-0 z-50" role="dialog" aria-modal="true" aria-label="{{ _('Search') }}">
	<div @click="open = false" class="absolute inset-0 bg-surface-alpha-gray-6"></div>
	<div class="absolute inset-x-0 top-0 flex h-[50vh] flex-col bg-surface-base px-5 py-4 shadow-2xl md:px-12">
		<form action="/{{ language }}/products" class="mx-auto flex w-full max-w-2xl gap-2" role="search">
			<input x-ref="search_input" type="text" enterkeyhint="search" name="search" x-model="query" @input.debounce.200ms="search()" autocomplete="off" placeholder="{{ _('Search products') }}" aria-label="{{ _('Search products') }}" class="h-10 w-full min-w-0 rounded-lg border border-transparent bg-surface-gray-2 px-3 text-lg text-ink-gray-8 outline-none placeholder:text-ink-gray-4 hover:bg-surface-gray-3 focus:border-outline-gray-4 focus:bg-surface-base focus:shadow-sm">
			<button type="button" @click="open = false" class="grid size-10 shrink-0 place-items-center rounded-lg text-ink-gray-8 hover:bg-surface-gray-3" aria-label="{{ _('Close') }}">{{ icon("close") }}</button>
		</form>
		<div class="mx-auto mt-3 w-full max-w-2xl flex-1 overflow-y-auto">
			{% include "components/search_results.html" %}
		</div>
	</div>
</div>
