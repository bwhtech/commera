{% macro address_input(kind, field, label, autocomplete, required=True, type="text") -%}
<label class="flex flex-col gap-2">
	<span class="field-label">{{ label }}</span>
	<input type="{{ type }}" x-model="forms.{{ kind }}.{{ field }}" autocomplete="{{ kind }} {{ autocomplete }}" {{ "required" if required }} class="field">
</label>
{%- endmacro %}

{% macro address_picker(kind, countries, saved_addresses) -%}
<div class="flex flex-col gap-3">
	{% if saved_addresses %}
	<div role="radiogroup" class="flex flex-col gap-2">
		{% for address in saved_addresses %}
		<label class="flex cursor-pointer items-start gap-3 rounded-lg border border-outline-gray-3 p-4 has-[:checked]:border-outline-gray-9 has-[:checked]:ring-1 has-[:checked]:ring-outline-gray-9">
			<input type="radio" name="{{ kind }}_address" value="{{ address.name }}" x-model="choices.{{ kind }}" class="mt-1 size-4 accent-current">
			<span class="flex flex-col gap-0.5 text-md">
				<span class="font-medium">{{ address.address_title or address.address_line1 }}</span>
				<span class="text-ink-gray-6"><bdi>{{ [address.address_line1, address.address_line2, address.city, address.state, address.pincode, address.country] | select | join(", ") }}</bdi></span>
			</span>
		</label>
		{% endfor %}
		<label class="flex cursor-pointer items-center gap-3 rounded-lg border border-outline-gray-3 p-4 text-md has-[:checked]:border-outline-gray-9 has-[:checked]:ring-1 has-[:checked]:ring-outline-gray-9">
			<input type="radio" name="{{ kind }}_address" value="new" x-model="choices.{{ kind }}" class="size-4 accent-current">
			{{ _("Use a new address") }}
		</label>
	</div>
	{% endif %}
	<div x-show="choices.{{ kind }} === 'new'" class="grid gap-3 sm:grid-cols-2">
		<template x-if="choices.{{ kind }} === 'new'">
			<div class="contents">
				{{ address_input(kind, "first_name", _("First name"), "given-name") }}
				{{ address_input(kind, "last_name", _("Last name"), "family-name", required=False) }}
				<div class="sm:col-span-2">{{ address_input(kind, "address_line1", _("Address"), "address-line1") }}</div>
				<div class="sm:col-span-2">{{ address_input(kind, "address_line2", _("Apartment, suite, landmark (optional)"), "address-line2", required=False) }}</div>
				{{ address_input(kind, "city", _("City"), "address-level2") }}
				{{ address_input(kind, "state", _("State"), "address-level1", required=False) }}
				{{ address_input(kind, "pincode", _("Postcode"), "postal-code") }}
				<label class="flex flex-col gap-2">
					<span class="field-label">{{ _("Country") }}</span>
					<select x-model="forms.{{ kind }}.country" autocomplete="{{ kind }} country-name" required class="field">
						{% for country in countries %}
						<option value="{{ country.name }}">{{ country.title }}</option>
						{% endfor %}
					</select>
				</label>
				<div class="sm:col-span-2">{{ address_input(kind, "phone", _("Phone"), "tel", type="tel") }}</div>
			</div>
		</template>
	</div>
</div>
{%- endmacro %}
