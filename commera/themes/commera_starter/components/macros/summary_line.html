{% macro summary_line(image, title, subtitle, qty, amount) -%}
<li class="flex items-center gap-3">
	<div class="relative w-14 shrink-0">
		<div class="media overflow-hidden rounded-lg">
			<img x-show="{{ image }}" :src="{{ image }}" alt="" class="aspect-[3/4] w-full object-cover object-top">
		</div>
		<span class="absolute -end-2 -top-2 grid size-5 place-items-center rounded-full bg-brand text-xs font-medium text-on-brand" x-text="{{ qty }}"></span>
	</div>
	<div class="min-w-0 flex-1">
		<div class="grid gap-1 sm:grid-cols-[minmax(0,1fr)_auto] sm:gap-3">
			<p class="text-md text-balance [overflow-wrap:anywhere]"><bdi x-text="{{ title }}"></bdi></p>
			<p class="tabular whitespace-nowrap text-md" x-text="{{ amount }}"></p>
		</div>
		<p class="mt-1 text-base text-ink-gray-6 [overflow-wrap:anywhere]" x-show="{{ subtitle }}" x-text="{{ subtitle }}"></p>
	</div>
</li>
{%- endmacro %}
