{% macro breadcrumbs(links) %}
<nav aria-label="{{ _('Breadcrumb') }}" class="text-base text-ink-gray-6">
	{%- for link in links %}
	{%- if not loop.first %}<span class="mx-1.5 text-ink-gray-4" aria-hidden="true">/</span>{% endif %}
	{%- if link.url %}<a href="{{ link.url|e }}" class="-my-3 inline-block py-3 hover:text-ink-gray-9">{{ link.label|e }}</a>{% else %}<span aria-current="page">{{ link.label|e }}</span>{% endif %}
	{%- endfor %}
</nav>
{%- endmacro %}
