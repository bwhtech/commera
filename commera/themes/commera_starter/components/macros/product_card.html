{% from "components/macros/image.html" import image with context %}
{% from "components/macros/price.html" import price with context %}

{% macro product_card(product) %}
<a href="{{ commera.format.product_url(product.handle) }}" class="block">
	{{ image(product.image, product.title) }}
	<p class="mt-3 text-base">{{ product.title or "" }}</p>
	<p class="mt-1 text-base">{{ price(product) }}</p>
</a>
{%- endmacro %}
