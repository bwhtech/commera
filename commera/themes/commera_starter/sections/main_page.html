{% if page is defined and page %}
<article class="mx-auto max-w-3xl px-5 py-16">
	{% if section.settings.show_title %}
	<h1 class="text-8xl">{{ page.title }}</h1>
	{% endif %}
	<div class="mt-8 text-p-base text-ink-gray-7 [&_a]:underline [&_h2]:mt-10 [&_h2]:text-3xl [&_h2]:text-ink-gray-9 [&_h3]:mt-8 [&_h3]:text-xl [&_h3]:text-ink-gray-9 [&_img]:my-8 [&_img]:rounded-xl [&_li]:mt-1 [&_ol]:mt-4 [&_ol]:list-decimal [&_ol]:ps-5 [&_p]:mt-4 [&_ul]:mt-4 [&_ul]:list-disc [&_ul]:ps-5">{{ page.body_html | safe }}</div>
</article>
{% endif %}
