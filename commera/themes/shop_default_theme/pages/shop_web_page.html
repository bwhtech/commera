{% extends "components/base.html" %}
{% from "templates/macros/page_not_found.html" import page_not_found %}

{% block body %}
{% if page %}
<article class="py-6 md:py-10">
	<h1 class="text-2xl font-semibold md:text-3xl">{{ page.name }}</h1>
	<div class="mt-6 max-w-3xl text-base leading-relaxed">
		{{ content|safe }}
	</div>
</article>
{% else %}
{{ page_not_found() }}
{% endif %}
{% endblock %}
