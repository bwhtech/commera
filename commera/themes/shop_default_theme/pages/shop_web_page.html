{% extends "components/base.html" %}

{% block body %}
{% if page %}
<article class="py-6 md:py-10">
	<h1 class="text-2xl font-semibold md:text-3xl">{{ page_title|e }}</h1>
	<div class="mt-6 max-w-3xl text-base leading-relaxed">
		{{ content|safe }}
	</div>
</article>
{% else %}
<div class="py-16 text-center">
	<h1 class="text-2xl font-semibold md:text-3xl">{{ _("Page not found") }}</h1>
	<p class="mt-3 text-gray-700">{{ _("This page has been moved or is no longer published.") }}</p>
	<a href="/{{ frappe.lang or 'en' }}" class="mt-6 inline-block underline hover:text-accent">
		{{ _("Back to home") }}
	</a>
</div>
{% endif %}
{% endblock %}
