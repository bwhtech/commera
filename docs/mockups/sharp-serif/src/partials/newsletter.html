<section class="section newsletter">
	<div class="container newsletter-grid">
		<div>
			<p class="eyebrow">Newsletter</p>
			<h2 class="h2">Good things, now and then.</h2>
		</div>
		<form class="newsletter-form" data-newsletter>
			<label class="sr-only" for="newsletter-email">Email address</label>
			<div class="input-group">
				<div class="field"><input id="newsletter-email" type="email" placeholder="you@example.com" autocomplete="email" required></div>
				<button class="btn btn-primary">Subscribe</button>
			</div>
			<p class="small muted">New finds and notes from the workshop. Twice a month.</p>
			<p class="small newsletter-feedback" role="status" data-newsletter-feedback></p>
		</form>
	</div>
</section>
